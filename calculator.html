<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f2430;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f5f7fa;
    }

    main {
      width: 320px;
      padding: 16px;
      border-radius: 12px;
      background: #2b3242;
      box-shadow: 0 10px 30px rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #c7d0e0;
    }

    #display {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 64px;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #161a23;
      color: #f5f7fa;
      font-size: 2rem;
      line-height: 40px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    #display.error {
      color: #ff8f8f;
      font-size: 1rem;
      line-height: 1.4;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #3d4658;
      color: #f5f7fa;
      font-size: 1.35rem;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #48536a;
    }

    button:focus-visible {
      outline: 2px solid #8ab4ff;
      outline-offset: 2px;
    }

    button.operator {
      background: #3e5b8a;
    }

    button.operator:hover {
      background: #4a6da3;
    }

    button.equals {
      background: #2f7d5d;
    }

    button.equals:hover {
      background: #39956f;
    }

    button.clear {
      background: #8a4a3e;
    }

    button.clear:hover {
      background: #a35a4a;
    }
  </style>
</head>
<body>
  <main>
    <h1>Calculator</h1>
    <output id="display" aria-live="polite" aria-atomic="true">0</output>
    <div class="keypad">
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" class="operator" data-op="÷" aria-label="divide">÷</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" class="operator" data-op="×" aria-label="multiply">×</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" class="operator" data-op="−" aria-label="subtract">−</button>

      <button type="button" data-digit="0">0</button>
      <button type="button" class="clear" data-action="clear" aria-label="clear">C</button>
      <button type="button" class="equals" data-action="equals" aria-label="equals">=</button>
      <button type="button" class="operator" data-op="+" aria-label="add">+</button>
    </div>
  </main>

  <script>
    (function () {
      var display = document.getElementById('display');

      var entry = '0';
      var hasEntry = false;
      var stored = null;
      var operator = null;
      var hasError = false;

      function render(text, isError) {
        display.textContent = text;
        display.classList.toggle('error', Boolean(isError));
      }

      function reset() {
        entry = '0';
        hasEntry = false;
        stored = null;
        operator = null;
        hasError = false;
        render('0', false);
      }

      function inputDigit(digit) {
        if (hasError) {
          reset();
        }
        if (hasEntry) {
          entry = entry === '0' ? digit : entry + digit;
        } else {
          entry = digit;
          hasEntry = true;
        }
        render(entry, false);
      }

      function chooseOperator(op) {
        if (hasError) {
          return;
        }
        // Without new digits, the value on screen (a result or the first
        // operand) becomes the left operand.
        stored = Number(hasEntry ? entry : display.textContent);
        operator = op;
        hasEntry = false;
        render(String(stored), false);
      }

      function equals() {
        if (hasError || operator === null || stored === null) {
          return;
        }
        var right = Number(hasEntry ? entry : display.textContent);
        var result;

        if (operator === '+') {
          result = stored + right;
        } else if (operator === '−') {
          result = stored - right;
        } else if (operator === '×') {
          result = stored * right;
        } else {
          if (right === 0) {
            entry = '0';
            hasEntry = false;
            stored = null;
            operator = null;
            hasError = true;
            render('Error: cannot divide by zero', true);
            return;
          }
          result = stored / right;
        }

        stored = null;
        operator = null;
        hasError = false;
        entry = String(result);
        hasEntry = false;
        render(entry, false);
      }

      document.querySelector('.keypad').addEventListener('click', function (event) {
        var button = event.target.closest('button');
        if (!button) {
          return;
        }
        var digit = button.getAttribute('data-digit');
        var op = button.getAttribute('data-op');
        var action = button.getAttribute('data-action');

        if (digit !== null) {
          inputDigit(digit);
        } else if (op !== null) {
          chooseOperator(op);
        } else if (action === 'equals') {
          equals();
        } else if (action === 'clear') {
          reset();
        }
      });
    })();
  </script>
</body>
</html>
